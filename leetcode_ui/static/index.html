<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LocalCode</title>
<link rel="stylesheet" href="/vendor/codemirror.css">
<link rel="stylesheet" href="/vendor/dracula.css">
<script src="/vendor/codemirror.js"></script>
<script src="/vendor/python.js"></script>
<script src="/vendor/active-line.js"></script>
<script src="/vendor/matchbrackets.js"></script>
<script src="/vendor/closebrackets.js"></script>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #252526;
    --border: #3c3c3c;
    --text: #d4d4d4;
    --muted: #8a8a8a;
    --accent: #0e639c;
    --accent-hover: #1177bb;
    --green: #4ec9b0;
    --red: #f14c4c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 10px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header .logo { color: var(--green); }
  #layout {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  #sidebar {
    width: 300px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    flex-shrink: 0;
  }
  .category {
    border-bottom: 1px solid var(--border);
  }
  .category-header {
    padding: 8px 12px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    display: flex;
    justify-content: space-between;
  }
  .category-header:hover { background: #2a2d2e; }
  .problem-list { display: block; }
  .problem-list.collapsed { display: none; }
  .problem-item {
    padding: 6px 12px 6px 20px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .problem-item:hover { background: #2a2d2e; }
  .problem-item.active { background: #37373d; }
  .check {
    width: 14px;
    flex-shrink: 0;
    color: var(--green);
  }
  .stub-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #main {
    flex: 1;
    display: flex;
    min-width: 0;
  }
  #desc-pane {
    width: 42%;
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px 24px;
  }
  #desc-pane h1 { font-size: 18px; margin: 0 0 12px; }
  #desc-pane pre {
    white-space: pre-wrap;
    font-family: -apple-system, sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    color: #cccccc;
  }
  #code-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #code-toolbar {
    padding: 8px 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 8px;
    align-items: center;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: #3c3c3c; }
  button.secondary:hover { background: #4a4a4a; }
  #editor-container {
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  .CodeMirror {
    height: 100%;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 13.5px;
    line-height: 1.5;
    padding: 8px 0;
  }
  .CodeMirror-gutters {
    background: #1e1e1e;
    border-right: 1px solid var(--border);
  }
  #results {
    height: 220px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: #181818;
    overflow-y: auto;
    padding: 12px 16px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
  }
  #results.empty { color: var(--muted); }
  .result-status {
    font-weight: 700;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .result-status.pass { color: var(--green); }
  .result-status.fail { color: var(--red); }
  .case-row { padding: 2px 0; }
  .case-row.PASSED { color: var(--green); }
  .case-row.FAILED, .case-row.ERROR { color: var(--red); }
  #raw-output {
    margin-top: 10px;
    white-space: pre-wrap;
    color: var(--muted);
    font-size: 11.5px;
  }
  #empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 14px;
  }
</style>
</head>
<body>
<header><span class="logo">&#9679;</span> LocalCode <span style="color:var(--muted); font-weight:400;">— your blind75 set</span></header>
<div id="layout">
  <div id="sidebar"></div>
  <div id="main">
    <div id="empty-state">Pick a problem from the sidebar to begin.</div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
